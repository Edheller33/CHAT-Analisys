<script>
'use strict';
// <ENGINE>
const VERSION='2.0.0';
const GAP=6*3600*1000;
const nz=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const p2=n=>String(n).padStart(2,'0');
const dayKey=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;};
const sum=(a,k)=>a.reduce((t,x)=>t+x[k],0);
const set=s=>new Set(s.split(' '));

/* ---------- Parsers ---------- */
const RE_A=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?(?:\s*([ap])\.?\s?m\.?)?\s*[-–]\s+(.*)$/i;
const RE_I=/^\[(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?(?:\s*([ap])\.?\s?m\.?)?\]\s+(.*)$/i;
const MEDIA_RE=/(multimedia omitido|media omitted|imagen omitida|image omitted|sticker omitido|sticker omitted|audio omitido|audio omitted|video omitido|video omitted|documento omitido|document omitted|gif omitido|gif omitted|\(archivo adjunto\)|<adjunto|<attached)/i;
const DEL_RE=/(eliminaste este mensaje|se elimin[oó] este mensaje|this message was deleted|you deleted this message)/i;

function parseWA(raw){
  const lines=raw.replace(/[\u202f\u00a0]/g,' ').replace(/[\u200e\u200f\u202a-\u202e\ufeff]/g,'').split(/\r?\n/);
  const ent=[];let a1=0,a2=0;
  for(const ln of lines){
    const m=RE_A.exec(ln)||RE_I.exec(ln);
    if(m){ent.push({m,ln:null});if(+m[1]>12)a1++;if(+m[2]>12)a2++;}
    else ent.push({m:null,ln});
  }
  const dayFirst=a2>a1?false:true;
  const out=[];let cur=null;
  for(const e of ent){
    if(!e.m){if(cur)cur[2]+='\n'+e.ln;continue;}
    const m=e.m;let d=+m[1],mo=+m[2],y=+m[3];
    if(!dayFirst){[d,mo]=[mo,d];}
    if(y<100)y+=2000;
    let h=+m[4];if(m[7]){h=h%12+(m[7].toLowerCase()==='p'?12:0);}
    const ts=new Date(y,mo-1,d,h,+m[5],+(m[6]||0)).getTime();
    if(isNaN(ts)){cur=null;continue;}
    const rest=m[8],i=rest.indexOf(': ');
    if(i<1||i>60){cur=null;continue;}
    cur=[ts,rest.slice(0,i).replace(/^~\s*/,'').trim(),rest.slice(i+2)];
    out.push(cur);
  }
  return out;
}
function parseTG(j){
  let arr=j.messages;
  if(!arr&&j.chats&&j.chats.list&&j.chats.list[0])arr=j.chats.list[0].messages;
  if(!Array.isArray(arr))return [];
  const out=[];
  for(const m of arr){
    if(m.type&&m.type!=='message')continue;
    let t=typeof m.text==='string'?m.text:Array.isArray(m.text)?m.text.map(x=>typeof x==='string'?x:(x&&x.text)||'').join(''):'';
    if(!t&&(m.photo||m.media_type||m.file))t='<Media omitted>';
    const ts=new Date(m.date).getTime();
    if(isNaN(ts)||(!t))continue;
    out.push([ts,String(m.from||m.actor||'Desconocido'),t]);
  }
  return out;
}
function parseChat(text){
  let rows=[];
  const t=text.replace(/^\ufeff/,'').trimStart();
  if(t[0]==='{'){try{rows=parseTG(JSON.parse(t));}catch(e){rows=[];}}
  if(!rows.length)rows=parseWA(text);
  const senders=[],idx=new Map(),msgs=[];
  for(const [ts,name,txt] of rows){
    let i=idx.get(name);if(i===undefined){i=senders.length;idx.set(name,i);senders.push(name);}
    msgs.push([ts,i,txt]);
  }
  msgs.sort((a,b)=>a[0]-b[0]);
  return {senders,msgs};
}

/* ---------- Léxicos (normalizados, ES/EN) ---------- */
const POS=set('gracias genial excelente increible hermoso hermosa lindo linda bonito bonita feliz contento contenta alegria amo amor encanta encantado perfecto bien bueno buena buenisimo divertido felicidades felicitaciones orgulloso orgullosa tranquilo tranquila fantastico maravilloso maravillosa mejor exito logro disfruto disfrutar gusto happy love great good awesome amazing thanks thank nice beautiful wonderful perfect glad proud best enjoy fun');
const NEG=set('mal malo mala triste tristeza odio odiar enojo enojado enojada coraje molesto molesta harto harta cansado cansada problema problemas pelea pelear culpa mentira mentiroso mentirosa idiota estupido estupida tonto tonta horrible terrible asco miedo preocupado preocupada llorar lloro dolor duele sufrir sufro decepcion decepcionado decepcionada peor fatal pesimo sad bad hate angry upset tired problem fight fault liar stupid idiot awful worst disappointed hurt cry');
const NEGATORS=set('no nunca jamas not never ni dont cant');
const STOP=set('de la que el en y a los se del las un por con una su para es al lo como mas pero sus le ya o este si porque esta entre cuando muy sin sobre tambien me hasta hay donde quien desde todo nos todos uno les ni contra otros ese eso ante ellos esto mi antes algunos unos yo otro otra tanto esa estos mucho nada muchos cual poco ella estar estas algo nosotros mis tu te ti tus ellas os mio mia nuestro estoy estamos estan sera the and to of in is it you that for on with this are be was have but at my me so we if do can ok va voy jaja jajaja tengo tiene tienes eres soy son fue ser vez aqui alla bien pues solo ahora cuando ver dos asi hoy vas voy vamos quiero puedo');
const NOISE=set('http https www com multimedia omitido omitted media archivo adjunto image imagen sticker audio video message mensaje eliminado deleted');
const JOY_RE=/^((ja|je|ji){2,}|(ha){2,}|lol|xd+|jaj\w*)$/;
const AFF_P=['te quiero','te amo','te extrano','mi amor','amor mio','mi vida','te adoro','te necesito','love you','miss you','my love','besos','abrazo','carino','corazon','babe'];
const CONF_P=['no me importa','dejame en paz','ya no puedo','terminamos','se acabo','no quiero hablar','leave me alone','i hate','me tienes harto','me tienes harta','no te soporto','ya basta','no me hables'];
const CONF_RE=/\b(idiota|estupid[oa]|callate|mentiros[oa]|mentira|tont[oa]|asco|harto|harta|basta|fastidi\w+|maldit[oa]|mierda|carajo|pendej[oa]|imbecil|fuck\w*|shit|stupid|idiot|liar|shut up)\b/g;
const ABS_RE=/\b(siempre|nunca|jamas|always|never)\b/;
const SAD_RE=/\b(triste|llorar|llorando|lloro|sad|cry|deprimid[oa])\b/;
const ANG_RE=/\b(enoj\w+|coraje|furios\w+|angry|molest\w+|odio|hate)\b/;
const EMO_RE=/\p{Extended_Pictographic}/gu;
const POSE='😀😃😄😁😆😊😍🥰😘❤💕💖💘💗👍🙏😂🤣🎉✨💪😉☺😎🥳';
const NEGE='😢😭😡😠😞😔💔👎😤😣😖😩🤬😒🙄';
const AFFE='😍🥰😘❤💕💖💘💗';

/* ---------- Análisis ---------- */
function bucketKey(d,mode){
  if(mode==='d')return dayKey(d);
  if(mode==='m')return d.getFullYear()+'-'+p2(d.getMonth()+1);
  const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return 'sem '+dayKey(x);
}
function analyze(c){
  const S=c.senders,M=c.msgs,T=M.length;
  const st=S.map(()=>({n:0,words:0,chars:0,emo:0,q:0,ex:0,caps:0,media:0,del:0,pos:0,neg:0,neu:0,score:0,aff:0,joy:0,sad:0,ang:0,conf:0,confN:0,init:0,rt:[],runs:0,text:0}));
  const heat=Array.from({length:7},()=>Array(24).fill(0));
  const wc=new Map(),ec=new Map(),days=new Map(),buckets=new Map();
  const first=M[0][0],last=M[T-1][0],spanMs=Math.max(1,last-first),spanDays=Math.max(1,spanMs/864e5);
  const mode=spanDays<=120?'d':spanDays<=900?'w':'m';
  const SC=new Float32Array(T),AF=new Float32Array(T),CF=new Float32Array(T);
  const confMsgs=[];const dayConf=new Map();
  const th=[0,1,2].map(()=>({n:0,sc:0,aff:0,cf:0,rt:[],txt:0}));
  const thOf=ts=>ts<first+spanMs/3?0:ts<first+2*spanMs/3?1:2;
  let maxGap=0,gapAt=0;
  for(let i=0;i<T;i++){
    const [ts,si,text]=M[i],s=st[si],d=new Date(ts),g=i?ts-M[i-1][0]:0,t3=th[thOf(ts)];
    s.n++;t3.n++;
    if(i===0||g>GAP)s.init++;
    if(i===0||M[i-1][1]!==si)s.runs++;
    if(i>0){if(g>maxGap){maxGap=g;gapAt=M[i-1][0];}if(M[i-1][1]!==si&&g<=GAP){s.rt.push(g);t3.rt.push(g);}}
    heat[(d.getDay()+6)%7][d.getHours()]++;
    const dk=dayKey(d);days.set(dk,(days.get(dk)||0)+1);
    const bk=bucketKey(d,mode);let b=buckets.get(bk);if(!b){b={n:0,sc:0,aff:0,conf:0,txt:0};buckets.set(bk,b);}b.n++;
    if(MEDIA_RE.test(text)){s.media++;continue;}
    if(DEL_RE.test(text)){s.del++;continue;}
    s.text++;t3.txt++;b.txt++;
    const low=text.toLowerCase(),n=nz(text),toks=low.match(/[a-záéíóúüñ]+/g)||[];
    s.words+=toks.length;s.chars+=text.length;
    if(text.includes('?'))s.q++;
    if(text.includes('!'))s.ex++;
    const letters=text.replace(/[^A-Za-zÁÉÍÓÚÑ]/g,'');let cap=0;
    if(letters.length>=8&&letters===letters.toUpperCase()){s.caps++;cap=1;}
    const em=text.match(EMO_RE)||[];s.emo+=em.length;
    let pos=0,neg=0,negate=0,aff=0;
    for(const e of em){ec.set(e,(ec.get(e)||0)+1);if(POSE.includes(e))pos++;else if(NEGE.includes(e))neg++;if(AFFE.includes(e))aff=1;}
    for(const raw of toks){
      const t=nz(raw);
      if(t.length>2&&!STOP.has(t)&&!NOISE.has(t))wc.set(raw,(wc.get(raw)||0)+1);
      if(NEGATORS.has(t)){negate=2;continue;}
      let p=POS.has(t),q=NEG.has(t);
      if(p||q){if(negate>0){const x=p;p=q;q=x;}if(p)pos++;else neg++;}
      if(JOY_RE.test(t))s.joy++;
      if(negate>0)negate--;
    }
    if(!aff&&AFF_P.some(x=>n.includes(x)))aff=1;
    if(aff)s.aff++;
    if(SAD_RE.test(n))s.sad++;
    if(ANG_RE.test(n))s.ang++;
    let cs=0;
    for(const x of CONF_P)if(n.includes(x))cs+=2;
    const cm=n.match(CONF_RE);if(cm)cs+=cm.length*2;
    if(neg>0&&ABS_RE.test(n))cs+=0.5;
    if(cap)cs+=1;
    if(/[!?]{3,}/.test(text))cs+=1;
    const score=pos-neg;
    s.score+=score;if(score>0)s.pos++;else if(score<0)s.neg++;else s.neu++;
    SC[i]=score;AF[i]=aff;CF[i]=cs;
    t3.sc+=score;t3.aff+=aff;t3.cf+=cs;b.sc+=score;b.aff+=aff;b.conf+=cs;
    if(cs>0){s.conf+=cs;if(cs>=2)s.confN++;dayConf.set(dk,(dayConf.get(dk)||0)+cs);confMsgs.push({ts,si,cs,text,dk});}
  }
  const series=[...buckets.entries()].map(([k,b])=>({label:k,...b}));
  const tot=sum(st,'conf');const txtTotal=Math.max(1,sum(st,'text'));
  const topDays=[...dayConf.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5).map(([dk,v])=>{
    const ex=confMsgs.filter(x=>x.dk===dk).sort((a,b)=>b.cs-a.cs).slice(0,2);
    return {dk,v,ex};
  });
  return {total:T,st,heat,days,series,mode,modeLabel:mode==='d'?'día':mode==='w'?'semana':'mes',
    spanDays,first,last,maxGap,gapAt,th,topDays,confIndex:tot/txtTotal*1000,
    topWords:[...wc.entries()].sort((a,b)=>b[1]-a[1]).slice(0,24),
    topEmo:[...ec.entries()].sort((a,b)=>b[1]-a[1]).slice(0,12),txtTotal};
}

/* ---------- Teléfonos ---------- */

function fmtNat(iso,nat){
  if(iso==='MX'&&nat.length===10){const a=MX_CITY[nat.slice(0,2)]?2:3,b=a===2?4:3;return [nat.slice(0,a),nat.slice(a,a+b),nat.slice(a+b)].join(' ');}

function parsePhone(raw,def){
  const s=String(raw||'').trim();
  if(!s)return {err:'Escribe un número.'};
  if(/[^\d\s()+\-.]/.test(s))return {err:'Solo se permiten dígitos, espacios, paréntesis, + y guiones.'};
  let d=s.replace(/\D/g,''),intl=s.startsWith('+');
  if(!intl&&d.startsWith('00')){d=d.slice(2);intl=true;}
  if(d.length<5)return {err:'Número demasiado corto.'};
  if(d.length>15)return {err:'Un número internacional (E.164) no excede 15 dígitos.'};
  const notes=[];let cc,nat;
  if(intl){cc=ccOf(d);if(!cc)return {err:'Código de país no reconocido.'};nat=d.slice(cc.length);}
  else{
    cc=ISO2CC[def]||'52';nat=d;
    const mx=LEN[def]?Math.max(...LEN[def]):11;
    if(d.startsWith(cc)&&d.length>mx){nat=d.slice(cc.length);notes.push('Se detectó el código de país dentro del número.');}
    else if(nat[0]==='0'&&!['IT','MX'].includes(def)&&nat.length>(LEN[def]?LEN[def][0]:8)){nat=nat.slice(1);notes.push('Se omitió el prefijo troncal 0.');}
  }
  if(cc==='52'){
    if(/^04[45]/.test(nat)&&nat.length>10){nat=nat.slice(3);notes.push('Se omitió el prefijo móvil antiguo (044/045).');}
    else if(/^01/.test(nat)&&nat.length>10){nat=nat.slice(2);notes.push('Se omitió el prefijo de larga distancia (01).');}
    else if(nat.length===11&&nat[0]==='1'){nat=nat.slice(1);notes.push('Formato móvil anterior a 2019 (+52 1): se normalizó a 10 dígitos.');}
  }
  let iso=CCM[cc],area='',city='',type='No determinable solo con el número';
  if(cc==='1'){area=nat.slice(0,3);iso=CA_AREA.has(area)?'CA':'US';}
  if(cc==='7'){iso=/^[67]/.test(nat)?'KZ':'RU';}
  if(iso==='MX'){const a=MX_CITY[nat.slice(0,2)]?nat.slice(0,2):nat.slice(0,3);area=a;city=MX_CITY[a]||'';}
  if(iso==='ES')type=/^[67]/.test(nat)?'Móvil':/^[89]/.test(nat)?'Fijo':type;
  if(iso==='GB')type=/^7/.test(nat)?'Móvil':type;
  if(iso==='CO')type=/^3/.test(nat)?'Móvil':/^60/.test(nat)?'Fijo':type;
  if(iso==='BR'&&nat.length===11)type=nat[2]==='9'?'Móvil':type;
  if(iso==='AR')type=nat[0]==='9'?'Móvil (prefijo 9)':type;
  const expect=LEN[iso]||null;
  const valid=expect?expect.includes(nat.length):(nat.length>=4&&nat.length<=12);
  const flags=[];
  if(/^(\d)\1{5,}$/.test(nat))flags.push('Dígitos repetidos');
  if(/1234567|7654321|0000000/.test(nat))flags.push('Secuencia numérica obvia');
  if(!valid)flags.push(expect?`Longitud ${nat.length} no coincide con la esperada (${expect.join(' u ')})`:'Longitud atípica');
  const natf=fmtNat(iso,nat);
  return {cc,nat,iso,e164:'+'+cc+nat,intlf:'+'+cc+' '+natf,natf,area,city,type,valid,expect,notes,flags,
    country:cname(iso),flag:flag(iso),shared:cc==='1'?'+1 es compartido por EE. UU., Canadá y varios países del Caribe.':cc==='7'?'+7 es compartido por Rusia y Kazajistán.':''};
}

/* ---------- Lectura de archivos ---------- */
async function unzipFirstText(buf){
  const v=new DataView(buf),u=new Uint8Array(buf);let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){if(v.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error('ZIP inválido');
  const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);const ents=[];
  for(let k=0;k<n;k++){
    if(v.getUint32(p,true)!==0x02014b50)break;
    const meth=v.getUint16(p+10,true),csz=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),off=v.getUint32(p+42,true);
    const name=new TextDecoder().decode(u.subarray(p+46,p+46+nl));
    ents.push({name,meth,csz,off});p+=46+nl+el+cl;
  }
  const pick=ents.find(x=>/\.txt$/i.test(x.name)&&/chat/i.test(x.name))||ents.find(x=>/\.txt$/i.test(x.name))||ents.find(x=>/\.json$/i.test(x.name));
  if(!pick)throw new Error('El ZIP no contiene un .txt');
  const lo=pick.off,start=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true);
  const data=u.subarray(start,start+pick.csz);
  if(pick.meth===0)return new TextDecoder().decode(data);
  if(pick.meth!==8)throw new Error('Compresión ZIP no soportada');
  if(typeof DecompressionStream==='undefined')throw new Error('Este navegador no puede descomprimir ZIP; extrae el .txt e impórtalo.');
  const ds=new DecompressionStream('deflate-raw');
  const out=await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer();
  return new TextDecoder().decode(out);
}
async function readFile(f){
  const buf=await f.arrayBuffer(),u=new Uint8Array(buf);
  if(u[0]===0x50&&u[1]===0x4b)return unzipFirstText(buf);
  return new TextDecoder('utf-8').decode(buf);
}
function prog(t){const e=$('#prog');if(e)e.textContent=t;}
async function importFiles(files){
  for(const f of files){
    try{
      prog('Leyendo '+f.name+'…');
      const text=await readFile(f);
      await new Promise(r=>setTimeout(r,20));
      prog('Interpretando mensajes…');
      const p=parseChat(text);
      if(!p.msgs.length)throw new Error('No se reconoció ningún mensaje (formato no compatible).');
      const id=crypto.randomUUID();
      const name=f.name.replace(/\.(txt|zip|json)$/i,'').replace(/^(chat de whatsapp con|whatsapp chat with|chat de whatsapp -|whatsapp chat -)\s*/i,'').trim()||'Chat';
      const meta={id,name,n:p.msgs.length,from:p.msgs[0][0],to:p.msgs[p.msgs.length-1][0],senders:p.senders,added:Date.now()};
      await dbPut('msgs',{id,senders:p.senders,msgs:p.msgs});

      state.list.push(meta);

function barSvg(vals,labels,color='#1F4FD8'){

}
function lineSvg(vals,labels){
  const W=320,H=110,n=vals.length;if(n<2)return '<p class="mut">Datos insuficientes para la tendencia.</p>';

  return `<svg viewBox="0 0 ${W} ${H+16}" class="ch" role="img" aria-label="Tendencia"><line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="#CBD5E1" stroke-dasharray="3 3"/><polyline fill="none" stroke="#1F4FD8" stroke-width="2.5" stroke-linejoin="round" points="${pts}"/><text class="t" x="0" y="${H+12}">${esc(labels[0]||'')}</text><text class="t" x="${W}" y="${H+12}" text-anchor="end">${esc(labels[n-1]||'')}</text><text class="t" x="2" y="10">+</text><text class="t" x="2" y="${H-2}">−</text></svg>`;
}
function heatHtml(h){
  const D=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];let mx=1;for(const r of h)for(const v of r)if(v>mx)mx=v;
  let s='<div class="heat">';
  h.forEach((r,i)=>{s+=`<span>${D[i]}</span>`+r.map((v,hh)=>`<i title="${D[i]} ${hh}:00 — ${v}" style="opacity:${(.06+.94*v/mx).toFixed(2)}"></i>`).join('');});
  s+='<span></span>'+Array.from({length:24},(_,i)=>`<span>${i%6===0?i:''}</span>`).join('')+'</div>';

function donut(P,N,U){const T=P+N+U||1,R=40,L=2*Math.PI*R,C=[['#1F4FD8','Positivo',P],['#E5484D','Negativo',N],['#CBD5E1','Neutral',U]];let o=0;

function styleOf(s){
  const L=[],tx=Math.max(1,s.text),aw=s.words/tx;
  L.push(aw<5?'Conciso (mensajes cortos)':aw>15?'Elaborado (mensajes largos)':'Longitud de mensaje media');
  const e=s.emo/Math.max(1,s.n);if(e>.5)L.push('Muy expresivo con emojis');else if(e<.05)L.push('Usa pocos emojis');
  if(s.q/tx>.2)L.push('Inquisitivo (muchas preguntas)');
  if(s.ex/tx>.2)L.push('Enfático (muchas exclamaciones)');
  if(s.caps/tx>.03)L.push('Usa MAYÚSCULAS con frecuencia');
  if(s.n/Math.max(1,s.runs)>2)L.push('Escribe en ráfagas de mensajes seguidos');
  if(s.rt.length>=5){const m=median(s.rt);L.push(m<120000?'Responde casi de inmediato':m<1800000?'Responde en minutos':'Responde con más demora');}
  return L;
}
function tCom(a,d){
  return d.senders.map((nm,i)=>{const s=a.st[i],tx=Math.max(1,s.text);
    return `<section class="card"><h3 style="color:${COLORS[i%6]}">${esc(nm)}</h3>
    <div class="kpis">${kpi('Palabras/msg',(s.words/tx).toFixed(1))}${kpi('Emojis/msg',(s.emo/Math.max(1,s.n)).toFixed(2))}${kpi('Preguntas',pct(s.q,tx)+'%')}${kpi('Resp. mediana',fmtDur(median(s.rt)))}${kpi('Ráfaga media',(s.n/Math.max(1,s.runs)).toFixed(1))}${kpi('Eliminados',s.del)}</div>
    <ul>${styleOf(s).map(x=>`<li>${x}</li>`).join('')}</ul></section>`;}).join('')+`<p class="mut">Perfiles descriptivos basados en métricas de escritura; no son evaluaciones psicológicas.</p>`;
}
function tEvo(a,d){
  if(a.spanDays<9)return '<p class="mut">El periodo es demasiado corto (&lt; 9 días) para estimar evolución.</p>';
  const th=a.th,per=a.spanDays/3,L=['Inicio','Medio','Reciente'];
  const rate=th.map(t=>t.n/per),aff=th.map(t=>t.txt?t.aff/t.txt*100:0),sc=th.map(t=>t.txt?t.sc/t.txt:0),rt=th.map(t=>median(t.rt));
  const trend=(x,y,rel=true,u=0.15)=>rel?(x===0?'—':y/x>1+u?'aumenta':y/x<1-u?'disminuye':'estable'):(y-x>u?'aumenta':y-x<-u?'disminuye':'estable');
  const initTot=sum(a.st,'init')||1,share=a.st.map(s=>s.init/initTot),mi=share.indexOf(Math.max(...share));
  const bal=a.st.map(s=>s.n/a.total),mb=bal.indexOf(Math.max(...bal));
  return `<section class="card"><h3>Tres etapas del periodo</h3><table><tr><th></th>${L.map(x=>`<th>${x}</th>`).join('')}</tr>
  <tr><td>Msgs/día</td>${rate.map(v=>`<td>${v.toFixed(1)}</td>`).join('')}</tr>
  <tr><td>Afecto /100</td>${aff.map(v=>`<td>${v.toFixed(1)}</td>`).join('')}</tr>
  <tr><td>Tono medio</td>${sc.map(v=>`<td>${v.toFixed(2)}</td>`).join('')}</tr>
  <tr><td>Resp. mediana</td>${rt.map(v=>`<td>${fmtDur(v)}</td>`).join('')}</tr></table></section>
  <section class="card"><h3>Lectura de patrones</h3><ul>
  <li>Intensidad de contacto: <b>${trend(rate[0],rate[2])}</b>.</li>
  <li>Expresiones de afecto: <b>${trend(aff[0],aff[2],false,1.5)}</b>.</li>
  <li>Tono emocional: <b>${trend(sc[0],sc[2],false,0.05)}</b>.</li>
  <li>Velocidad de respuesta: <b>${rt[0]&&rt[2]?(rt[2]/rt[0]<.85?'más rápida':rt[2]/rt[0]>1.15?'más lenta':'estable'):'sin datos suficientes'}</b>.</li>
  <li>Iniciativa: ${share[mi]>.7?`desbalanceada hacia <b>${esc(d.senders[mi])}</b> (${Math.round(share[mi]*100)}%)`:'repartida de forma equilibrada'}.</li>
  <li>Participación: ${bal[mb]>.65?`<b>${esc(d.senders[mb])}</b> escribe ${Math.round(bal[mb]*100)}% de los mensajes`:'equilibrada entre participantes'}.</li></ul>
  <p class="mut">Comparación entre el primer y el último tercio del periodo. Son indicadores estadísticos, no conclusiones sobre la relación.</p></section>`;
}
function tBus(){
  return `<section class="card"><label>Buscar en el chat<input id="q" type="search" placeholder="palabra o frase" value="${esc(state.q)}" autocomplete="off"></label>
  <label>Remitente<select id="qs"><option value="-1">Todos</option>${state.chat.data.senders.map((s,i)=>`<option value="${i}" ${String(i)===state.qs?'selected':''}>${esc(s)}</option>`).join('')}</select></label>
  <div id="res" class="mut"></div></section>`;
}
function doSearch(){
  const q=nz(state.q.trim()),box=$('#res');if(!box)return;
  if(q.length<2){box.textContent='Escribe al menos 2 caracteres.';return;}
  const d=state.chat.data,si=+state.qs,out=[];let tot=0;
  for(let i=d.msgs.length-1;i>=0;i--){const m=d.msgs[i];if(si>=0&&m[1]!==si)continue;if(nz(m[2]).includes(q)){tot++;if(out.length<80)out.push(m);}}
  box.innerHTML=`<p>${nf(tot)} coincidencias${tot>80?' (se muestran las 80 más recientes)':''}.</p>`+out.map(m=>`<div class="msg"><small>${esc(new Date(m[0]).toLocaleString('es-MX'))} · ${esc(d.senders[m[1]])}</small>${esc(m[2].slice(0,240))}</div>`).join('');
}

/* ---------- Vistas ---------- */
function vChats(){
  const l=state.list;
  return `<section class="hero"><h2>Análisis profundo de chats</h2><p class="mut">Importa un chat exportado (.txt o .zip de WhatsApp, .json de Telegram). Todo se procesa en este dispositivo.</p><button class="btn" data-act="import">${ICO.plus}Importar chat</button><div id="prog" class="mut"></div></section>`+
  (l.length?l.map(c=>`<article class="card"><div class="row"><div><b>${esc(c.name)}</b><div class="mut">${nf(c.n)} mensajes · ${c.senders.length} participantes</div><div class="mut">${fd(c.from)} → ${fd(c.to)}</div></div><button class="ico" data-act="delchat" data-id="${c.id}" aria-label="Eliminar chat">${ICO.trash}</button></div><button class="btn sec" data-act="open" data-id="${c.id}">Analizar</button></article>`).join('')
  :`<p class="mut c">Aún no hay chats. En WhatsApp: abre el chat → ⋮ → Más → Exportar chat → Sin multimedia, guarda el archivo e impórtalo aquí.</p>`);
}
function vChat(){
  const T=[['res','Resumen'],['sen','Sentimientos'],['con','Conflicto'],['com','Comunicación'],['evo','Evolución'],['bus','Buscar']];
  const a=state.an,d=state.chat.data;
  const tabs=`<div class="tabs">${T.map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${state.tab===k?'on':''}">${l}</button>`).join('')}</div>`;
  const warn=a.total<200?`<p class="warn">Muestra pequeña (${a.total} mensajes): los indicadores son poco fiables.</p>`:'';
  const body={res:tRes,sen:tSen,con:tCon,com:tCom,evo:tEvo,bus:tBus}[state.tab](a,d);
  return tabs+warn+body+'<button class="btn sec" data-act="print">Guardar informe en PDF</button>';
}
function countryOpts(sel){
  const isos=[...new Set([...Object.values(CCM),'CA','KZ'])].map(i=>[i,cname(i)]).sort((x,y)=>x[1].localeCompare(y[1],'es'));
  return isos.map(([i,n])=>`<option value="${i}" ${i===sel?'selected':''}>${flag(i)} ${esc(n)} (+${ISO2CC[i]})</option>`).join('');
}
function phoneCard(r){
  if(r.err)return `<p class="warn">${esc(r.err)}</p>`;
  return `<div style="margin-top:12px"><div class="big">${r.flag} ${esc(r.intlf)}</div>
  <p>${r.valid?'<span class="tag ok">Formato plausible</span>':'<span class="tag mid">Revisar formato</span>'} <span class="mut">${esc(r.country)}</span></p>
  <table><tr><th>E.164</th><td>${esc(r.e164)}</td></tr><tr><th>Internacional</th><td>${esc(r.intlf)}</td></tr><tr><th>Nacional</th><td>${esc(r.natf)}</td></tr>
  <tr><th>Código de país</th><td>+${r.cc}</td></tr><tr><th>${r.cc==='1'?'Código de área':'Lada / prefijo'}</th><td>${esc(r.area||'—')}${r.city?' · '+esc(r.city):''}</td></tr>
  <tr><th>Dígitos nacionales</th><td>${r.nat.length}${r.expect?' (esperado '+r.expect.join(' u ')+')':''}</td></tr><tr><th>Tipo de línea</th><td>${esc(r.type)}</td></tr></table>
  ${r.shared?`<p class="mut">${esc(r.shared)}</p>`:''}${r.notes.map(n=>`<p class="mut">${esc(n)}</p>`).join('')}${r.flags.map(n=>`<p class="warn">${esc(n)}</p>`).join('')}
  <p class="mut">El análisis es estructural: no identifica al titular ni la ubicación exacta de la línea.</p>
  <label>Vincular con un chat importado (opcional)<select id="lk"><option value="">— ninguno —</option>${state.list.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>
  <button class="btn" data-act="savenum">Guardar número</button><button class="btn sec" data-act="copy" data-v="${esc(r.e164)}">Copiar E.164</button></div>`;
}
function vNums(){
  return `<section class="card"><h3>Analizar número</h3>
  <label>Nombre (opcional)<input id="nm" maxlength="60" autocomplete="off"></label>
  <label>País por defecto<select id="cty">${countryOpts('MX')}</select></label>
  <label>Número<input id="ph" inputmode="tel" placeholder="+52 33 1234 5678" autocomplete="off"></label>
  <button class="btn" data-act="analizar">Analizar</button><div id="pres"></div></section>
  <h3>Números guardados</h3>`+
  (state.nums.length?state.nums.map(n=>{const c=state.list.find(x=>x.id===n.chatId);return `<article class="card"><div class="row"><div><b>${esc(n.name||'Sin nombre')}</b><div class="mut">${n.flag||''} ${esc(n.intlf||n.e164)}</div>${c?`<div class="mut">Chat: ${esc(c.name)} · ${nf(c.n)} mensajes</div>`:''}</div><button class="ico" data-act="delnum" data-id="${n.id}" aria-label="Eliminar">${ICO.trash}</button></div>${c?`<button class="btn sec" data-act="open" data-id="${c.id}">Ver estadísticas del chat</button>`:''}</article>`;}).join(''):'<p class="mut">Sin números guardados.</p>');
}
function vSet(){
  return `<section class="card"><h3>Datos y respaldo</h3><p class="mut">Versión ${VERSION} · PASEF v1.0 STABLE</p><div id="st" class="mut"></div>
  <button class="btn sec" data-act="export">Exportar respaldo (.json)</button><button class="btn sec" data-act="importbk">Restaurar respaldo</button>
  <button class="btn sec" data-act="install" id="inst" hidden>Instalar aplicación</button><button class="btn bad" data-act="wipe">Borrar todos los datos</button></section>
  <section class="card pol"><h3>Política de privacidad</h3>
  <p><b>Qué hace CHAT-Analisys.</b> Es una herramienta independiente de análisis de chats y números de teléfono. No está afiliada a WhatsApp, Telegram ni a ninguna plataforma de mensajería y no accede a tus cuentas.</p>
  <p><b>Datos que procesa.</b> Solo los archivos de chat que tú importas manualmente y los números que escribes. No solicita permisos de contactos, micrófono, cámara ni ubicación.</p>
  <p><b>Dónde se guardan.</b> Exclusivamente en el almacenamiento local de este navegador (IndexedDB). No existen cuentas, servidores propios, analítica, publicidad ni rastreadores. La aplicación no envía tus conversaciones ni tus números a ningún tercero.</p>
  <p><b>Análisis.</b> Se calcula en el dispositivo con reglas estadísticas y léxicos; no utiliza servicios de IA remotos. Los resultados son indicadores orientativos y pueden contener errores.</p>
  <p><b>Tu control.</b> Puedes eliminar chats o números individualmente, o borrar todo desde “Borrar todos los datos”. Los respaldos .json que exportes quedan bajo tu custodia.</p>
  <p><b>Uso responsable.</b> Importa únicamente conversaciones en las que participas o para las que tienes autorización. Las conversaciones contienen datos de terceros; respétalos y cumple la ley aplicable. El análisis de un número no identifica a su titular.</p>
  <p><b>Alojamiento.</b> La aplicación se sirve desde GitHub Pages; el proveedor de alojamiento puede registrar los accesos técnicos a los archivos de la app, pero no recibe tus datos locales.</p></section>`;
}

/* ---------- Render / eventos ---------- */
function render(){
  const v=state.view,m=$('#main');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(v==='chat'?'chats':v)));
  $('#back').hidden=v!=='chat';$('#logo').hidden=v==='chat';
  $('#title').textContent=v==='chat'?state.chat.meta.name:'CHAT-Analisys';
  m.innerHTML=v==='chats'?vChats():v==='numeros'?vNums():v==='ajustes'?vSet():vChat();
  if(v==='chat'&&state.tab==='bus')doSearch();
  if(v==='ajustes')storageInfo();
  if(v!=='chat')window.scrollTo(0,0);
}
async function storageInfo(){
  const e=$('#st');if(!e||!navigator.storage||!navigator.storage.estimate)return;
  try{const s=await navigator.storage.estimate();e.textContent=`Almacenamiento usado: ${(s.usage/1048576).toFixed(1)} MB de ${(s.quota/1048576).toFixed(0)} MB`;}catch(x){}
  if(deferred){const b=$('#inst');if(b)b.hidden=false;}
}
async function openChat(id){
  try{
    const [meta,data]=[state.list.find(c=>c.id===id),await dbGet('msgs',id)];
    if(!meta||!data)throw new Error('Chat no encontrado');
    toast('Analizando…',1500);await new Promise(r=>setTimeout(r,30));
    state.chat={meta,data};state.an=analyze(data);state.tab='res';state.view='chat';state.q='';state.qs='-1';
    history.pushState({v:'chat'},'');render();
  }catch(e){toast('Error: '+e.message,5000);}
}
function goBack(){state.view='chats';state.chat=null;state.an=null;render();}
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;});
window.addEventListener('popstate',()=>{if(state.view==='chat')goBack();});
$('#back').addEventListener('click',()=>history.back());
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.v;state.chat=null;render();}));
$('#file').addEventListener('change',e=>{const f=[...e.target.files];e.target.value='';if(f.length)importFiles(f);});
$('#bk').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)restore(f);});
let qt;
document.addEventListener('input',e=>{if(e.target.id==='q'){state.q=e.target.value;clearTimeout(qt);qt=setTimeout(doSearch,250);}});
document.addEventListener('change',e=>{if(e.target.id==='qs'){state.qs=e.target.value;doSearch();}});
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  try{
  if(a==='import')$('#file').click();
  else if(a==='open')openChat(t.dataset.id);
  else if(a==='tab'){state.tab=t.dataset.v;render();}
  else if(a==='delchat'){if(!confirm('¿Eliminar este chat y su análisis del dispositivo?'))return;await dbDel('chats',t.dataset.id);await dbDel('msgs',t.dataset.id);state.list=state.list.filter(c=>c.id!==t.dataset.id);
    for(const n of state.nums)if(n.chatId===t.dataset.id){n.chatId='';await dbPut('numbers',n);}render();}
  else if(a==='analizar'){state.lastPhone=parsePhone($('#ph').value,$('#cty').value);state.lastPhone.name=$('#nm').value.trim();$('#pres').innerHTML=phoneCard(state.lastPhone);}
  else if(a==='savenum'){const r=state.lastPhone;if(!r||r.err)return;
    const o={id:crypto.randomUUID(),name:($('#nm').value||'').trim().slice(0,60),e164:r.e164,intlf:r.intlf,flag:r.flag,iso:r.iso,chatId:$('#lk').value,added:Date.now()};
    await dbPut('numbers',o);state.nums.push(o);toast('Número guardado');render();}
  else if(a==='delnum'){await dbDel('numbers',t.dataset.id);state.nums=state.nums.filter(n=>n.id!==t.dataset.id);render();}
  else if(a==='copy'){try{await navigator.clipboard.writeText(t.dataset.v);toast('Copiado');}catch(x){toast('No se pudo copiar');}}
  else if(a==='export')await backup();
  else if(a==='print')window.print();
  else if(a==='importbk')$('#bk').click();
  else if(a==='install'){if(deferred){deferred.prompt();deferred=null;}}
  else if(a==='wipe'){if(!confirm('Se borrarán TODOS los chats y números de este dispositivo. ¿Continuar?'))return;
    await Promise.all(['chats','msgs','numbers'].map(dbClear));state.list=[];state.nums=[];toast('Datos borrados');render();}
  }catch(err){toast('Error: '+err.message,5000);}
});
async function backup(){
  const data={app:'CHAT-Analisys',version:VERSION,date:new Date().toISOString(),chats:await dbAll('chats'),msgs:await dbAll('msgs'),numbers:await dbAll('numbers')};
  const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='CHAT-Analisys-respaldo-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}
async function restore(f){
  try{
    const j=JSON.parse(await f.text());
    if(j.app!=='CHAT-Analisys'||!Array.isArray(j.chats)||!Array.isArray(j.msgs))throw new Error('Archivo de respaldo no válido');
    for(const c of j.chats)await dbPut('chats',c);for(const m of j.msgs)await dbPut('msgs',m);for(const n of (j.numbers||[]))await dbPut('numbers',n);
    state.list=await dbAll('chats');state.nums=await dbAll('numbers');toast('Respaldo restaurado');render();
  }catch(e){toast('No se pudo restaurar: '+e.message,6000);}
}
(async()=>{
  try{state.list=(await dbAll('chats')).sort((a,b)=>b.added-a.added);state.nums=await dbAll('numbers');}catch(e){toast('Almacenamiento local no disponible: '+e.message,7000);}
  render();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
